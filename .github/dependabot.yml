version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    target-branch: main
    labels:
      - dependencies
    open-pull-requests-limit: 15
    groups:
      production-patch-minor:
        dependency-type: production
        update-types:
          - "patch"
          - "minor"
      development-patch-minor:
        dependency-type: development
        update-types:
          - "patch"
          - "minor"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - dependencies
      - github-actions
    open-pull-requests-limit: 15
